title: "macsix.io"
subtitle: "Projects, tinkering and write-ups"
description: >-
  David's projects: home automation, 3D dashboards, energy monitoring and other things built for fun.
baseurl: ""
url: "https://macsix.io"

remote_theme: "mmistakes/minimal-mistakes@4.27.1"
minimal_mistakes_skin: "dark"

search: true
search_full_content: true
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

include: ["_pages", "_posts", "_data"]
exclude: ["README.md", "Gemfile", "Gemfile.lock", "LICENSE", "LICENSE.txt", ".idea"]

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      show_date: true
      read_time: true
      layout: single
      classes: wide
      author_profile: true
      share: true
      related: true
      toc: true
      toc_sticky: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide

author:
  name: "David"
  bio: >-
    Software engineer in Scotland. By day I build software; in the evenings I tinker with home automation,
    energy monitoring and anything else that can be wired into Home Assistant.
  location: "Scotland, UK"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/davidmacsix"

locale: "en-GB"
markdown: kramdown
highlighter: rouge
